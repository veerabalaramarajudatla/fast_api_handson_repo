name: GitHub Security - Snyk 3-Layer Scan

# ================================================================
# MANUAL TRIGGER ONLY
# ================================================================

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # BRANCH
      # ============================================================

      branch:
        description: "GitHub branch to scan"
        required: true
        type: string


      # ============================================================
      # SNYK CODE / SAST
      # ============================================================

      sast_high:
        description: "Check SAST High vulnerabilities"
        required: true
        type: boolean
        default: true

      sast_max_high:
        description: "Maximum allowed SAST High vulnerabilities"
        required: true
        type: number
        default: 0

      sast_medium:
        description: "Check SAST Medium vulnerabilities"
        required: true
        type: boolean
        default: true

      sast_max_medium:
        description: "Maximum allowed SAST Medium vulnerabilities"
        required: true
        type: number
        default: 0

      sast_low:
        description: "Check SAST Low vulnerabilities"
        required: true
        type: boolean
        default: true

      sast_max_low:
        description: "Maximum allowed SAST Low vulnerabilities"
        required: true
        type: number
        default: 0


      # ============================================================
      # SNYK OPEN SOURCE / SCA
      # ============================================================

      sca_critical:
        description: "Check SCA Critical vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_critical:
        description: "Maximum allowed SCA Critical vulnerabilities"
        required: true
        type: number
        default: 0

      sca_high:
        description: "Check SCA High vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_high:
        description: "Maximum allowed SCA High vulnerabilities"
        required: true
        type: number
        default: 0

      sca_medium:
        description: "Check SCA Medium vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_medium:
        description: "Maximum allowed SCA Medium vulnerabilities"
        required: true
        type: number
        default: 0

      sca_low:
        description: "Check SCA Low vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_low:
        description: "Maximum allowed SCA Low vulnerabilities"
        required: true
        type: number
        default: 0


      # ============================================================
      # SNYK CONTAINER
      # ============================================================

      container_critical:
        description: "Check Container Critical vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_critical:
        description: "Maximum allowed Container Critical vulnerabilities"
        required: true
        type: number
        default: 0

      container_high:
        description: "Check Container High vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_high:
        description: "Maximum allowed Container High vulnerabilities"
        required: true
        type: number
        default: 5

      container_medium:
        description: "Check Container Medium vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_medium:
        description: "Maximum allowed Container Medium vulnerabilities"
        required: true
        type: number
        default: 10

      container_low:
        description: "Check Container Low vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_low:
        description: "Maximum allowed Container Low vulnerabilities"
        required: true
        type: number
        default: 20


# ================================================================
# GLOBAL ENVIRONMENT
# ================================================================

env:

  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

  SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}

  IMAGE_NAME: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}


# ================================================================
# JOB 1
# SECURITY SCANNING
# ================================================================

jobs:

  security-scan:

    name: Snyk Security Scan

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:

      # ============================================================
      # CHECKOUT SELECTED BRANCH
      # ============================================================

      - name: Checkout Selected Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # ============================================================
      # BUILD INFORMATION
      # ============================================================

      - name: Display Build Information
        run: |

          echo "=================================================="
          echo "GITHUB SECURITY PIPELINE"
          echo "=================================================="

          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Run Number : ${{ github.run_number }}"

          echo "=================================================="


      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # INSTALL APPLICATION DEPENDENCIES
      # ============================================================

      - name: Install Python Dependencies
        working-directory: ./app
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================================
      # INSTALL SNYK
      # ============================================================

      - name: Install Snyk CLI
        run: |

          npm install -g snyk

          snyk --version


      # ============================================================
      # ============================================================
      # 1. SNYK CODE / SAST
      # ============================================================
      # ============================================================

      - name: Run Snyk Code - SAST
        id: snyk_code
        continue-on-error: true

        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        run: |

          echo "=================================================="
          echo "1. SNYK CODE / SAST"
          echo "=================================================="

          rm -f snyk-code.json
          rm -f snyk-code-output.txt

          set +e

          snyk code test \
            --org="${SNYK_ORG_ID}" \
            --json-file-output=snyk-code.json \
            > snyk-code-output.txt 2>&1

          SNYK_CODE_EXIT=$?

          echo "Snyk Code Exit Code: ${SNYK_CODE_EXIT}"

          cat snyk-code-output.txt

          echo "SNYK_CODE_EXIT=${SNYK_CODE_EXIT}" >> "$GITHUB_ENV"

          exit 0


      # ============================================================
      # SAST SUMMARY
      # ============================================================

      - name: Generate SAST Summary
        if: always()
        run: |

          {
            echo "=================================================="
            echo "SNYK CODE / SAST REPORT"
            echo "=================================================="
            echo ""
            echo "Repository : ${{ github.repository }}"
            echo "Branch     : ${{ inputs.branch }}"
            echo "Commit     : ${{ github.sha }}"
            echo ""
            echo "Snyk Code Exit Code: ${SNYK_CODE_EXIT}"
            echo ""
            echo "Configured Thresholds:"
            echo "High   Enabled=${{ inputs.sast_high }}   Max=${{ inputs.sast_max_high }}"
            echo "Medium Enabled=${{ inputs.sast_medium }} Max=${{ inputs.sast_max_medium }}"
            echo "Low    Enabled=${{ inputs.sast_low }}    Max=${{ inputs.sast_max_low }}"
            echo ""
            echo "=================================================="
            echo ""
            cat snyk-code-output.txt 2>/dev/null || true
          } > sast-summary.txt


      # ============================================================
      # SAST QUALITY GATE
      # ============================================================

      - name: Evaluate SAST Quality Gate
        id: sast_gate
        if: always()
        run: |

          echo "=================================================="
          echo "SAST QUALITY GATE"
          echo "=================================================="

          echo "High   Enabled=${{ inputs.sast_high }}   Max=${{ inputs.sast_max_high }}"
          echo "Medium Enabled=${{ inputs.sast_medium }} Max=${{ inputs.sast_max_medium }}"
          echo "Low    Enabled=${{ inputs.sast_low }}    Max=${{ inputs.sast_max_low }}"

          echo ""

          if [ "${SNYK_CODE_EXIT}" = "0" ]; then

            echo "SAST QUALITY GATE: PASSED"

          else

            echo "SAST QUALITY GATE: FINDINGS DETECTED"

            echo ""
            echo "Snyk Code reported findings or scan issues."
            echo "The complete report will be available for Security Review."

          fi


      # ============================================================
      # ============================================================
      # 2. SNYK OPEN SOURCE / SCA
      # ============================================================
      # ============================================================

      - name: Run Snyk Open Source - SCA
        id: snyk_sca
        continue-on-error: true

        working-directory: ./app

        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        run: |

          echo "=================================================="
          echo "2. SNYK OPEN SOURCE / SCA"
          echo "=================================================="

          rm -f ../snyk-sca.json
          rm -f ../snyk-sca-output.txt

          set +e

          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --command=python \
            --org="${SNYK_ORG_ID}" \
            --json-file-output=../snyk-sca.json \
            > ../snyk-sca-output.txt 2>&1

          SNYK_SCA_EXIT=$?

          echo "Snyk SCA Exit Code: ${SNYK_SCA_EXIT}"

          cat ../snyk-sca-output.txt

          echo "SNYK_SCA_EXIT=${SNYK_SCA_EXIT}" >> "$GITHUB_ENV"

          exit 0


      # ============================================================
      # SCA SUMMARY
      # ============================================================

      - name: Generate SCA Summary
        if: always()
        run: |

          {
            echo "=================================================="
            echo "SNYK OPEN SOURCE / SCA REPORT"
            echo "=================================================="
            echo ""
            echo "Repository : ${{ github.repository }}"
            echo "Branch     : ${{ inputs.branch }}"
            echo "Commit     : ${{ github.sha }}"
            echo ""
            echo "Snyk SCA Exit Code: ${SNYK_SCA_EXIT}"
            echo ""
            echo "Configured Thresholds:"
            echo "Critical Enabled=${{ inputs.sca_critical }} Max=${{ inputs.sca_max_critical }}"
            echo "High     Enabled=${{ inputs.sca_high }} Max=${{ inputs.sca_max_high }}"
            echo "Medium   Enabled=${{ inputs.sca_medium }} Max=${{ inputs.sca_max_medium }}"
            echo "Low      Enabled=${{ inputs.sca_low }} Max=${{ inputs.sca_max_low }}"
            echo ""
            echo "=================================================="
            echo ""
            cat snyk-sca-output.txt 2>/dev/null || true
          } > sca-summary.txt


      # ============================================================
      # SCA QUALITY GATE
      # ============================================================

      - name: Evaluate SCA Quality Gate
        id: sca_gate
        if: always()
        run: |

          echo "=================================================="
          echo "SCA QUALITY GATE"
          echo "=================================================="

          echo "Critical Enabled=${{ inputs.sca_critical }} Max=${{ inputs.sca_max_critical }}"
          echo "High     Enabled=${{ inputs.sca_high }} Max=${{ inputs.sca_max_high }}"
          echo "Medium   Enabled=${{ inputs.sca_medium }} Max=${{ inputs.sca_max_medium }}"
          echo "Low      Enabled=${{ inputs.sca_low }} Max=${{ inputs.sca_max_low }}"

          echo ""

          if [ "${SNYK_SCA_EXIT}" = "0" ]; then

            echo "SCA QUALITY GATE: PASSED"

          else

            echo "SCA QUALITY GATE: FINDINGS DETECTED"

            echo ""
            echo "Snyk Open Source reported vulnerabilities or scan issues."
            echo "The complete report will be available for Security Review."

          fi


      # ============================================================
      # ============================================================
      # 3. DOCKER IMAGE BUILD
      # ============================================================
      # ============================================================

      - name: Build Docker Image
        run: |

          echo "=================================================="
          echo "3. DOCKER IMAGE BUILD"
          echo "=================================================="

          docker build \
            -f app/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            ./app

          echo ""
          echo "Docker image successfully built."

          docker images "${IMAGE_NAME}"


      # ============================================================
      # ============================================================
      # 4. SNYK CONTAINER
      # ============================================================
      # ============================================================

      - name: Run Snyk Container Scan
        id: snyk_container
        continue-on-error: true

        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        run: |

          echo "=================================================="
          echo "4. SNYK CONTAINER"
          echo "=================================================="

          rm -f snyk-container.json
          rm -f snyk-container-output.txt

          set +e

          snyk container test \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --org="${SNYK_ORG_ID}" \
            --file=app/Dockerfile \
            --json-file-output=snyk-container.json \
            > snyk-container-output.txt 2>&1

          SNYK_CONTAINER_EXIT=$?

          echo "Snyk Container Exit Code: ${SNYK_CONTAINER_EXIT}"

          cat snyk-container-output.txt

          echo "SNYK_CONTAINER_EXIT=${SNYK_CONTAINER_EXIT}" >> "$GITHUB_ENV"

          exit 0


      # ============================================================
      # CONTAINER SUMMARY
      # ============================================================

      - name: Generate Container Summary
        if: always()
        run: |

          {
            echo "=================================================="
            echo "SNYK CONTAINER REPORT"
            echo "=================================================="
            echo ""
            echo "Repository : ${{ github.repository }}"
            echo "Branch     : ${{ inputs.branch }}"
            echo "Commit     : ${{ github.sha }}"
            echo ""
            echo "Image      : ${IMAGE_NAME}:${IMAGE_TAG}"
            echo ""
            echo "Snyk Container Exit Code: ${SNYK_CONTAINER_EXIT}"
            echo ""
            echo "Configured Thresholds:"
            echo "Critical Enabled=${{ inputs.container_critical }} Max=${{ inputs.container_max_critical }}"
            echo "High     Enabled=${{ inputs.container_high }} Max=${{ inputs.container_max_high }}"
            echo "Medium   Enabled=${{ inputs.container_medium }} Max=${{ inputs.container_max_medium }}"
            echo "Low      Enabled=${{ inputs.container_low }} Max=${{ inputs.container_max_low }}"
            echo ""
            echo "=================================================="
            echo ""
            cat snyk-container-output.txt 2>/dev/null || true
          } > container-summary.txt


      # ============================================================
      # CONTAINER QUALITY GATE
      # ============================================================

      - name: Evaluate Container Quality Gate
        id: container_gate
        if: always()
        run: |

          echo "=================================================="
          echo "CONTAINER QUALITY GATE"
          echo "=================================================="

          echo "Critical Enabled=${{ inputs.container_critical }} Max=${{ inputs.container_max_critical }}"
          echo "High     Enabled=${{ inputs.container_high }} Max=${{ inputs.container_max_high }}"
          echo "Medium   Enabled=${{ inputs.container_medium }} Max=${{ inputs.container_max_medium }}"
          echo "Low      Enabled=${{ inputs.container_low }} Max=${{ inputs.container_max_low }}"

          echo ""

          if [ "${SNYK_CONTAINER_EXIT}" = "0" ]; then

            echo "CONTAINER QUALITY GATE: PASSED"

          else

            echo "CONTAINER QUALITY GATE: FINDINGS DETECTED"

            echo ""
            echo "Snyk Container reported vulnerabilities or scan issues."
            echo "The complete report will be available for Security Review."

          fi


      # ============================================================
      # ============================================================
      # SECURITY SUMMARY
      # ============================================================
      # ============================================================

      - name: Generate Security Summary
        if: always()
        run: |

          cat > security-summary.md <<EOF

          # Security Scan Summary

          ## Build Information

          | Item | Value |
          |---|---|
          | Repository | ${{ github.repository }} |
          | Branch | ${{ inputs.branch }} |
          | Commit | ${{ github.sha }} |
          | Actor | ${{ github.actor }} |
          | Run Number | ${{ github.run_number }} |
          | Image | ${IMAGE_NAME}:${IMAGE_TAG} |

          ## Snyk Code / SAST

          - Scan: Snyk Code
          - Purpose: Source Code Security Analysis
          - Exit Code: ${SNYK_CODE_EXIT}

          ## Snyk Open Source / SCA

          - Scan: Snyk Open Source
          - Purpose: Dependency Vulnerability Analysis
          - Dependency File: app/requirements.txt
          - Exit Code: ${SNYK_SCA_EXIT}

          ## Snyk Container

          - Scan: Snyk Container
          - Purpose: Docker Image Vulnerability Analysis
          - Image: ${IMAGE_NAME}:${IMAGE_TAG}
          - Exit Code: ${SNYK_CONTAINER_EXIT}

          ## SAST Thresholds

          | Severity | Enabled | Maximum |
          |---|---:|---:|
          | High | ${{ inputs.sast_high }} | ${{ inputs.sast_max_high }} |
          | Medium | ${{ inputs.sast_medium }} | ${{ inputs.sast_max_medium }} |
          | Low | ${{ inputs.sast_low }} | ${{ inputs.sast_max_low }} |

          ## SCA Thresholds

          | Severity | Enabled | Maximum |
          |---|---:|---:|
          | Critical | ${{ inputs.sca_critical }} | ${{ inputs.sca_max_critical }} |
          | High | ${{ inputs.sca_high }} | ${{ inputs.sca_max_high }} |
          | Medium | ${{ inputs.sca_medium }} | ${{ inputs.sca_max_medium }} |
          | Low | ${{ inputs.sca_low }} | ${{ inputs.sca_max_low }} |

          ## Container Thresholds

          | Severity | Enabled | Maximum |
          |---|---:|---:|
          | Critical | ${{ inputs.container_critical }} | ${{ inputs.container_max_critical }} |
          | High | ${{ inputs.container_high }} | ${{ inputs.container_max_high }} |
          | Medium | ${{ inputs.container_medium }} | ${{ inputs.container_max_medium }} |
          | Low | ${{ inputs.container_low }} | ${{ inputs.container_max_low }} |

          ## Reports

          The following reports are attached to this workflow:

          1. Snyk Code JSON
          2. Snyk Open Source JSON
          3. Snyk Container JSON
          4. SAST Summary
          5. SCA Summary
          6. Container Summary

          EOF

          cat security-summary.md


      # ============================================================
      # SECURITY APPROVAL DETAILS
      # ============================================================

      - name: Create Security Approval Details
        if: always()
        run: |

          cat > approval-body.md <<EOF

          # Security Approval Required

          Security review is required before pushing the Docker image to Amazon ECR.

          ## Repository

          ${{ github.repository }}

          ## Branch

          ${{ inputs.branch }}

          ## Commit

          ${{ github.sha }}

          ## Docker Image

          ${IMAGE_NAME}:${IMAGE_TAG}

          ## Snyk Code / SAST

          Exit Code: ${SNYK_CODE_EXIT}

          ## Snyk Open Source / SCA

          Exit Code: ${SNYK_SCA_EXIT}

          ## Snyk Container

          Exit Code: ${SNYK_CONTAINER_EXIT}

          ## Reports

          Review the workflow artifacts:

          - snyk-code.json
          - snyk-code-output.txt
          - sast-summary.txt

          - snyk-sca.json
          - snyk-sca-output.txt
          - sca-summary.txt

          - snyk-container.json
          - snyk-container-output.txt
          - container-summary.txt

          - security-summary.md

          ## Approval

          Enter:

          APPROVE

          to continue with ECR push.

          Enter:

          DECLINE

          to stop the pipeline.

          EOF

          cat approval-body.md


      # ============================================================
      # UPLOAD ALL REPORTS
      # ============================================================

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-reports-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            snyk-code.json
            snyk-code-output.txt
            sast-summary.txt
            snyk-sca.json
            snyk-sca-output.txt
            sca-summary.txt
            snyk-container.json
            snyk-container-output.txt
            container-summary.txt
            security-summary.md
            approval-body.md


      # ============================================================
      # MANUAL SECURITY APPROVAL
      # ============================================================

      - name: Security Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.APPROVERS }}
          minimum-approvals: 1

          issue-title: >-
            Security Approval -
            ${{ github.repository }} -
            ${{ inputs.branch }}

          issue-body-file-path: approval-body.md

          exclude-workflow-initiator-as-approver: false

          fail-on-denial: true

          additional-approved-words: "APPROVE"

          additional-denied-words: "DECLINE"

          polling-interval-seconds: 15


      # ============================================================
      # APPROVAL COMPLETED
      # ============================================================

      - name: Security Approval Completed
        run: |

          echo "=================================================="
          echo "SECURITY APPROVAL COMPLETED"
          echo "=================================================="

          echo "Branch : ${{ inputs.branch }}"
          echo "Commit : ${{ github.sha }}"
          echo "Image  : ${IMAGE_NAME}:${IMAGE_TAG}"

          echo ""
          echo "Proceeding to ECR push."


# ================================================================
# JOB 2
# PUSH TO ECR + COSIGN
# ================================================================

  push-and-sign:

    name: Push Image to ECR and Sign

    needs:
      - security-scan

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # ============================================================
      # CHECKOUT SAME BRANCH
      # ============================================================

      - name: Checkout Approved Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0


      # ============================================================
      # DISPLAY APPROVED BUILD
      # ============================================================

      - name: Display Approved Build
        run: |

          echo "=================================================="
          echo "APPROVED BUILD"
          echo "=================================================="

          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Image Tag  : ${IMAGE_TAG}"


      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # LOGIN TO ECR
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # BUILD APPROVED IMAGE
      # ============================================================

      - name: Build Approved Docker Image
        run: |

          echo "=================================================="
          echo "BUILDING APPROVED DOCKER IMAGE"
          echo "=================================================="

          docker build \
            -f app/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            ./app

          echo ""
          echo "Approved image built successfully."

          docker images "${IMAGE_NAME}"


      # ============================================================
      # CREATE ECR URI
      # ============================================================

      - name: Prepare ECR Image
        run: |

          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          echo "ECR URI:"
          echo "${ECR_URI}"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${ECR_URI}:${IMAGE_TAG}"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${ECR_URI}:latest"

          echo "ECR_URI=${ECR_URI}" >> "$GITHUB_ENV"


      # ============================================================
      # PUSH VERSIONED IMAGE
      # ============================================================

      - name: Push Versioned Image to ECR
        run: |

          echo "=================================================="
          echo "PUSHING VERSIONED IMAGE"
          echo "=================================================="

          docker push "${ECR_URI}:${IMAGE_TAG}"


      # ============================================================
      # PUSH LATEST IMAGE
      # ============================================================

      - name: Push Latest Image to ECR
        run: |

          echo "=================================================="
          echo "PUSHING LATEST IMAGE"
          echo "=================================================="

          docker push "${ECR_URI}:latest"


      # ============================================================
      # GET IMAGE DIGEST
      # ============================================================

      - name: Get ECR Image Digest
        run: |

          echo "=================================================="
          echo "GETTING ECR IMAGE DIGEST"
          echo "=================================================="

          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "ECR Image Digest:"
          echo "${DIGEST}"

          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"


      # ============================================================
      # INSTALL COSIGN
      # ============================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1


      # ============================================================
      # COSIGN SIGN
      # ============================================================

      - name: Sign ECR Image
        env:
          COSIGN_YES: "true"

        run: |

          echo "=================================================="
          echo "COSIGN IMAGE SIGNING"
          echo "=================================================="

          cosign sign \
            --yes \
            "${ECR_URI}@${IMAGE_DIGEST}"

          echo ""
          echo "Image signed successfully."


      # ============================================================
      # VERIFY COSIGN SIGNATURE
      # ============================================================

      - name: Verify Cosign Signature
        run: |

          echo "=================================================="
          echo "VERIFYING COSIGN SIGNATURE"
          echo "=================================================="

          cosign verify \
            "${ECR_URI}@${IMAGE_DIGEST}" \
            --certificate-identity-regexp ".*" \
            --certificate-oidc-issuer-regexp ".*"

          echo ""
          echo "Cosign signature verification completed."


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final Pipeline Summary
        run: |

          echo ""
          echo "=================================================="
          echo "SECURITY PIPELINE COMPLETED"
          echo "=================================================="

          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Commit     : ${{ github.sha }}"

          echo ""
          echo "Security Scans:"
          echo "  Snyk Code        : COMPLETED"
