name: GitHub Security - Snyk 3-Layer Scan

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # GITHUB BRANCH
      # ============================================================

      branch:
        description: "GitHub branch to scan"
        required: true
        type: string

      # ============================================================
      # SNYK CODE / SAST
      # ============================================================

      sast_severity_mode:
        description: "Snyk Code severity mode"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE

      sast_high:
        description: "Check SAST High vulnerabilities"
        required: true
        type: boolean
        default: true

      sast_max_high:
        description: "Maximum allowed SAST High vulnerabilities"
        required: true
        type: number
        default: 0

      sast_medium:
        description: "Check SAST Medium vulnerabilities"
        required: true
        type: boolean
        default: true

      sast_max_medium:
        description: "Maximum allowed SAST Medium vulnerabilities"
        required: true
        type: number
        default: 0

      sast_low:
        description: "Check SAST Low vulnerabilities"
        required: true
        type: boolean
        default: true

      sast_max_low:
        description: "Maximum allowed SAST Low vulnerabilities"
        required: true
        type: number
        default: 0

      # ============================================================
      # SNYK OPEN SOURCE / SCA
      # ============================================================

      sca_severity_mode:
        description: "Snyk Open Source severity mode"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE

      sca_critical:
        description: "Check SCA Critical vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_critical:
        description: "Maximum allowed SCA Critical vulnerabilities"
        required: true
        type: number
        default: 0

      sca_high:
        description: "Check SCA High vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_high:
        description: "Maximum allowed SCA High vulnerabilities"
        required: true
        type: number
        default: 0

      sca_medium:
        description: "Check SCA Medium vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_medium:
        description: "Maximum allowed SCA Medium vulnerabilities"
        required: true
        type: number
        default: 0

      sca_low:
        description: "Check SCA Low vulnerabilities"
        required: true
        type: boolean
        default: true

      sca_max_low:
        description: "Maximum allowed SCA Low vulnerabilities"
        required: true
        type: number
        default: 0

      # ============================================================
      # SNYK CONTAINER
      # ============================================================

      container_severity_mode:
        description: "Snyk Container severity mode"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE

      container_critical:
        description: "Check Container Critical vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_critical:
        description: "Maximum allowed Container Critical vulnerabilities"
        required: true
        type: number
        default: 0

      container_high:
        description: "Check Container High vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_high:
        description: "Maximum allowed Container High vulnerabilities"
        required: true
        type: number
        default: 5

      container_medium:
        description: "Check Container Medium vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_medium:
        description: "Maximum allowed Container Medium vulnerabilities"
        required: true
        type: number
        default: 10

      container_low:
        description: "Check Container Low vulnerabilities"
        required: true
        type: boolean
        default: true

      container_max_low:
        description: "Maximum allowed Container Low vulnerabilities"
        required: true
        type: number
        default: 20


# ================================================================
# GLOBAL ENVIRONMENT
# ================================================================

env:

  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

  SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}

  IMAGE_NAME: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}


# ================================================================
# SECURITY SCAN JOB
# ================================================================

jobs:

  security-scan:

    name: Snyk Security Scan

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      issues: write

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout Selected Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Display Build Information
        run: |
          echo "=================================================="
          echo "GitHub Security Scan"
          echo "=================================================="
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Actor      : ${{ github.actor }}"
          echo "=================================================="


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================================
      # INSTALL SNYK
      # ==========================================================

      - name: Install Snyk CLI
        run: |
          npm install -g snyk
          snyk --version


      # ==========================================================
      # ==========================================================
      # 1. SNYK CODE / SAST
      # ==========================================================
      # ==========================================================

      - name: Run Snyk Code - SAST
        id: snyk_code
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          echo "=================================================="
          echo "Running Snyk Code / SAST"
          echo "=================================================="

          set +e

          snyk code test \
            --org="${SNYK_ORG_ID}" \
            --json-file-output=snyk-code.json \
            > snyk-code-output.txt 2>&1

          SNYK_CODE_EXIT=$?

          echo "Snyk Code Exit Code: ${SNYK_CODE_EXIT}"

          cat snyk-code-output.txt

          echo "SNYK_CODE_EXIT=${SNYK_CODE_EXIT}" >> "$GITHUB_ENV"

          exit 0


      # ==========================================================
      # SAST REPORT
      # ==========================================================

      - name: Generate SAST Summary
        run: |

          echo "==================================================" > sast-summary.txt
          echo "SNYK CODE / SAST REPORT" >> sast-summary.txt
          echo "==================================================" >> sast-summary.txt

          echo "Branch: ${{ inputs.branch }}" >> sast-summary.txt
          echo "Commit: ${{ github.sha }}" >> sast-summary.txt

          echo "" >> sast-summary.txt

          echo "Snyk Code Exit Code: ${SNYK_CODE_EXIT}" >> sast-summary.txt

          echo "" >> sast-summary.txt

          cat snyk-code-output.txt >> sast-summary.txt || true


      # ==========================================================
      # SAST QUALITY GATE
      # ==========================================================

      - name: Evaluate SAST Quality Gate
        id: sast_gate
        run: |

          echo "=================================================="
          echo "SAST QUALITY GATE"
          echo "=================================================="

          if [ "${{ inputs.sast_severity_mode }}" = "ALL" ]; then

            echo "SAST mode: ALL"

            if [ "${SNYK_CODE_EXIT}" = "0" ]; then
              echo "SAST QUALITY GATE: PASSED"
            else
              echo "SAST QUALITY GATE: FAILED"
              echo "Snyk Code reported issues or scan failure."
              exit 1
            fi

          else

            echo "SAST mode: SELECTIVE"
            echo ""
            echo "Configured thresholds:"
            echo "High   enabled=${{ inputs.sast_high }}   max=${{ inputs.sast_max_high }}"
            echo "Medium enabled=${{ inputs.sast_medium }} max=${{ inputs.sast_max_medium }}"
            echo "Low    enabled=${{ inputs.sast_low }}    max=${{ inputs.sast_max_low }}"
            echo ""

            if [ "${SNYK_CODE_EXIT}" = "0" ]; then
              echo "SAST QUALITY GATE: PASSED"
            else
              echo "SAST QUALITY GATE: REVIEW REQUIRED"
              echo ""
              echo "Snyk Code detected findings."
              echo "The complete SAST report is available as an artifact."
              echo ""
              echo "For the POC, the scan is allowed to continue to report generation."
            fi

          fi


      # ==========================================================
      # ==========================================================
      # 2. SNYK OPEN SOURCE / SCA
      # ==========================================================
      # ==========================================================

      - name: Run Snyk Open Source - SCA
        id: snyk_sca
        continue-on-error: true
        working-directory: ./app
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          echo "=================================================="
          echo "Running Snyk Open Source / SCA"
          echo "=================================================="

          set +e

          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --command=python \
            --org="${SNYK_ORG_ID}" \
            --json-file-output=../snyk-sca.json \
            > ../snyk-sca-output.txt 2>&1

          SNYK_SCA_EXIT=$?

          echo "Snyk SCA Exit Code: ${SNYK_SCA_EXIT}"

          cat ../snyk-sca-output.txt

          echo "SNYK_SCA_EXIT=${SNYK_SCA_EXIT}" >> "$GITHUB_ENV"

          exit 0


      # ==========================================================
      # SCA SUMMARY
      # ==========================================================

      - name: Generate SCA Summary
        run: |

          echo "==================================================" > sca-summary.txt
          echo "SNYK OPEN SOURCE / SCA REPORT" >> sca-summary.txt
          echo "==================================================" >> sca-summary.txt

          echo "Branch: ${{ inputs.branch }}" >> sca-summary.txt
          echo "Commit: ${{ github.sha }}" >> sca-summary.txt

          echo "" >> sca-summary.txt

          echo "Snyk SCA Exit Code: ${SNYK_SCA_EXIT}" >> sca-summary.txt

          echo "" >> sca-summary.txt

          cat snyk-sca-output.txt >> sca-summary.txt || true


      # ==========================================================
      # SCA QUALITY GATE
      # ==========================================================

      - name: Evaluate SCA Quality Gate
        id: sca_gate
        run: |

          echo "=================================================="
          echo "SCA QUALITY GATE"
          echo "=================================================="

          echo "SCA Mode: ${{ inputs.sca_severity_mode }}"

          echo ""
          echo "Configured thresholds:"
          echo "Critical enabled=${{ inputs.sca_critical }} max=${{ inputs.sca_max_critical }}"
          echo "High     enabled=${{ inputs.sca_high }}     max=${{ inputs.sca_max_high }}"
          echo "Medium   enabled=${{ inputs.sca_medium }}   max=${{ inputs.sca_max_medium }}"
          echo "Low      enabled=${{ inputs.sca_low }}      max=${{ inputs.sca_max_low }}"

          echo ""

          if [ "${SNYK_SCA_EXIT}" = "0" ]; then
            echo "SCA QUALITY GATE: PASSED"
          else
            echo "SCA QUALITY GATE: REVIEW REQUIRED"
            echo ""
            echo "Snyk Open Source detected vulnerabilities or scan issues."
            echo "The complete SCA report is available as an artifact."
          fi


      # ==========================================================
      # ==========================================================
      # 3. DOCKER IMAGE BUILD
      # ==========================================================
      # ==========================================================

      - name: Build Docker Image
        run: |

          echo "=================================================="
          echo "Building Docker Image"
          echo "=================================================="

          docker build \
            -f app/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            ./app

          echo ""
          echo "Docker image created:"
          docker images "${IMAGE_NAME}"


      # ==========================================================
      # ==========================================================
      # 4. SNYK CONTAINER
      # ==========================================================
      # ==========================================================

      - name: Run Snyk Container Scan
        id: snyk_container
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          echo "=================================================="
          echo "Running Snyk Container"
          echo "=================================================="

          set +e

          snyk container test \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --org="${SNYK_ORG_ID}" \
            --file=app/Dockerfile \
            --json-file-output=snyk-container.json \
            > snyk-container-output.txt 2>&1

          SNYK_CONTAINER_EXIT=$?

          echo "Snyk Container Exit Code: ${SNYK_CONTAINER_EXIT}"

          cat snyk-container-output.txt

          echo "SNYK_CONTAINER_EXIT=${SNYK_CONTAINER_EXIT}" >> "$GITHUB_ENV"

          exit 0


      # ==========================================================
      # CONTAINER SUMMARY
      # ==========================================================

      - name: Generate Container Summary
        run: |

          echo "==================================================" > container-summary.txt
          echo "SNYK CONTAINER REPORT" >> container-summary.txt
          echo "==================================================" >> container-summary.txt

          echo "Branch: ${{ inputs.branch }}" >> container-summary.txt
          echo "Commit: ${{ github.sha }}" >> container-summary.txt

          echo "" >> container-summary.txt

          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}" >> container-summary.txt

          echo "" >> container-summary.txt

          echo "Snyk Container Exit Code: ${SNYK_CONTAINER_EXIT}" >> container-summary.txt

          echo "" >> container-summary.txt

          cat snyk-container-output.txt >> container-summary.txt || true


      # ==========================================================
      # CONTAINER QUALITY GATE
      # ==========================================================

      - name: Evaluate Container Quality Gate
        id: container_gate
        run: |

          echo "=================================================="
          echo "CONTAINER QUALITY GATE"
          echo "=================================================="

          echo "Container Mode: ${{ inputs.container_severity_mode }}"

          echo ""
          echo "Configured thresholds:"
          echo "Critical enabled=${{ inputs.container_critical }} max=${{ inputs.container_max_critical }}"
          echo "High     enabled=${{ inputs.container_high }}     max=${{ inputs.container_max_high }}"
          echo "Medium   enabled=${{ inputs.container_medium }}   max=${{ inputs.container_max_medium }}"
          echo "Low      enabled=${{ inputs.container_low }}      max=${{ inputs.container_max_low }}"

          echo ""

          if [ "${SNYK_CONTAINER_EXIT}" = "0" ]; then
            echo "CONTAINER QUALITY GATE: PASSED"
          else
            echo "CONTAINER QUALITY GATE: REVIEW REQUIRED"
            echo ""
            echo "Snyk Container detected vulnerabilities or scan issues."
            echo "The complete Container report is available as an artifact."
          fi


      # ==========================================================
      # ==========================================================
      # SECURITY SUMMARY
      # ==========================================================
      # ==========================================================

      - name: Generate Security Summary
        run: |

          cat > security-summary.md <<EOF
          # Security Scan Summary

          ## Build Information

          | Item | Value |
          |---|---|
          | Repository | ${{ github.repository }} |
          | Branch | ${{ inputs.branch }} |
          | Commit | ${{ github.sha }} |
          | Actor | ${{ github.actor }} |
          | Workflow | ${{ github.workflow }} |
          | Run Number | ${{ github.run_number }} |

          ## Security Scans

          ### 1. Snyk Code / SAST

          - Scan: Snyk Code
          - Purpose: Source-code security analysis
          - Exit Code: ${SNYK_CODE_EXIT}

          ### 2. Snyk Open Source / SCA

          - Scan: Snyk Open Source
          - Purpose: Dependency vulnerability analysis
          - File: app/requirements.txt
          - Exit Code: ${SNYK_SCA_EXIT}

          ### 3. Snyk Container

          - Scan: Snyk Container
          - Image: ${IMAGE_NAME}:${IMAGE_TAG}
          - Exit Code: ${SNYK_CONTAINER_EXIT}

          ## Threshold Configuration

          ### SAST

          - Mode: ${{ inputs.sast_severity_mode }}
          - High: ${{ inputs.sast_high }} / Max ${{ inputs.sast_max_high }}
          - Medium: ${{ inputs.sast_medium }} / Max ${{ inputs.sast_max_medium }}
          - Low: ${{ inputs.sast_low }} / Max ${{ inputs.sast_max_low }}

          ### SCA

          - Mode: ${{ inputs.sca_severity_mode }}
          - Critical: ${{ inputs.sca_critical }} / Max ${{ inputs.sca_max_critical }}
          - High: ${{ inputs.sca_high }} / Max ${{ inputs.sca_max_high }}
          - Medium: ${{ inputs.sca_medium }} / Max ${{ inputs.sca_max_medium }}
          - Low: ${{ inputs.sca_low }} / Max ${{ inputs.sca_max_low }}

          ### Container

          - Mode: ${{ inputs.container_severity_mode }}
          - Critical: ${{ inputs.container_critical }} / Max ${{ inputs.container_max_critical }}
          - High: ${{ inputs.container_high }} / Max ${{ inputs.container_max_high }}
          - Medium: ${{ inputs.container_medium }} / Max ${{ inputs.container_max_medium }}
          - Low: ${{ inputs.container_low }} / Max ${{ inputs.container_max_low }}

          ## Reports

          The following reports are attached to this workflow run:

          - Snyk Code JSON
          - Snyk Open Source JSON
          - Snyk Container JSON
          - SAST console output
          - SCA console output
          - Container console output

          EOF

          cat security-summary.md


      # ==========================================================
      # CREATE APPROVAL BODY
      # ==========================================================

      - name: Create Security Approval Details
        run: |

          cat > approval-body.md <<EOF
          # Security Review Required

          A security review is required before pushing the Docker image to ECR.

          ## Repository

          ${{ github.repository }}

          ## Branch

          ${{ inputs.branch }}

          ## Commit

          ${{ github.sha }}

          ## Docker Image

          ${IMAGE_NAME}:${IMAGE_TAG}

          ## Snyk Scans

          ### Snyk Code / SAST

          Exit Code: ${SNYK_CODE_EXIT}

          ### Snyk Open Source / SCA

          Exit Code: ${SNYK_SCA_EXIT}

          ### Snyk Container

          Exit Code: ${SNYK_CONTAINER_EXIT}

          ## Review Instructions

          Review the workflow artifacts before approving.

          Available reports:

          1. snyk-code.json
          2. snyk-sca.json
          3. snyk-container.json
          4. sast-summary.txt
          5. sca-summary.txt
          6. container-summary.txt
          7. security-summary.md

          Enter APPROVE to continue with ECR push.

          Enter DECLINE to stop the deployment.

          EOF

          cat approval-body.md


      # ==========================================================
      # UPLOAD ALL REPORTS
      # ==========================================================

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-reports-${{ github.run_number }}
          retention-days: 30
          path: |
            snyk-code.json
            snyk-code-output.txt
            sast-summary.txt
            snyk-sca.json
            snyk-sca-output.txt
            sca-summary.txt
            snyk-container.json
            snyk-container-output.txt
            container-summary.txt
            security-summary.md
            approval-body.md


      # ==========================================================
      # MANUAL SECURITY APPROVAL
      # ==========================================================

      - name: Security Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.APPROVERS }}
          minimum-approvals: 1
          issue-title: "Security Approval - ${{ github.repository }} - ${{ inputs.branch }}"
          issue-body-file-path: approval-body.md
          exclude-workflow-initiator-as-approver: false
          fail-on-denial: true
          additional-approved-words: "APPROVE"
          additional-denied-words: "DECLINE"
          polling-interval-seconds: 15


      # ==========================================================
      # SECURITY APPROVED
      # ==========================================================

      - name: Security Approval Completed
        run: |

          echo "=================================================="
          echo "SECURITY APPROVAL COMPLETED"
          echo "=================================================="

          echo "Branch : ${{ inputs.branch }}"
          echo "Commit : ${{ github.sha }}"
          echo "Image  : ${IMAGE_NAME}:${IMAGE_TAG}"

          echo ""
          echo "Proceeding to ECR push."


# ================================================================
# PUSH + SIGN JOB
# ================================================================

  push-and-sign:

    name: Push Image to ECR and Sign

    needs:
      - security-scan

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # ==========================================================
      # CHECKOUT SAME BRANCH
      # ==========================================================

      - name: Checkout Approved Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0


      # ==========================================================
      # DISPLAY BUILD INFORMATION
      # ==========================================================

      - name: Display Approved Build
        run: |

          echo "=================================================="
          echo "APPROVED BUILD"
          echo "=================================================="

          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Image Tag  : ${IMAGE_TAG}"


      # ==========================================================
      # AWS OIDC
      # ==========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # ECR LOGIN
      # ==========================================================

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================================
      # BUILD SAME IMAGE FROM APPROVED COMMIT
      # ==========================================================

      - name: Build Approved Docker Image
        run: |

          echo "=================================================="
          echo "Building Approved Docker Image"
          echo "=================================================="

          docker build \
            -f app/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            ./app

          echo "Image built successfully."


      # ==========================================================
      # TAG ECR IMAGE
      # ==========================================================

      - name: Tag Image for ECR
        run: |

          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          echo "ECR URI: ${ECR_URI}"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${ECR_URI}:${IMAGE_TAG}"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${ECR_URI}:latest"

          echo "ECR_URI=${ECR_URI}" >> "$GITHUB_ENV"


      # ==========================================================
      # PUSH IMAGE
      # ==========================================================

      - name: Push Docker Image to ECR
        run: |

          echo "=================================================="
          echo "Pushing Docker Image to ECR"
          echo "=================================================="

          docker push "${ECR_URI}:${IMAGE_TAG}"

          docker push "${ECR_URI}:latest"


      # ==========================================================
      # GET IMAGE DIGEST
      # ==========================================================

      - name: Get ECR Image Digest
        run: |

          echo "=================================================="
          echo "Getting ECR Image Digest"
          echo "=================================================="

          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "ECR Image Digest:"
          echo "${DIGEST}"

          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"


      # ==========================================================
      # INSTALL COSIGN
      # ==========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1


      # ==========================================================
      # COSIGN SIGN
      # ==========================================================

      - name: Sign ECR Image
        env:
          COSIGN_YES: "true"
        run: |

          echo "=================================================="
          echo "Signing ECR Image"
          echo "=================================================="

          cosign sign \
            --yes \
            "${ECR_URI}@${IMAGE_DIGEST}"

          echo "Image signed successfully."


      # ==========================================================
      # VERIFY SIGNATURE
      # ==========================================================

      - name: Verify Cosign Signature
        run: |

          echo "=================================================="
          echo "Verifying Cosign Signature"
          echo "=================================================="

          cosign verify \
            "${ECR_URI}@${IMAGE_DIGEST}" \
            --certificate-identity-regexp ".*" \
            --certificate-oidc-issuer-regexp ".*"

          echo ""
          echo "Cosign signature verification completed."


      # ==========================================================
      # FINAL SUMMARY
      # ==========================================================

      - name: Final Deployment Summary
        run: |

          echo ""
          echo "=================================================="
          echo "SECURITY PIPELINE COMPLETED"
          echo "=================================================="

          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Commit     : ${{ github.sha }}"
          echo "ECR        : ${ECR_URI}"
          echo "Tag        : ${IMAGE_TAG}"
          echo "Digest     : ${IMAGE_DIGEST}"

          echo ""
          echo "Security:"
          echo "  Snyk Code       : COMPLETED"
          echo "  Snyk Open Source: COMPLETED"
          echo "  Snyk Container   : COMPLETED"

          echo ""
          echo "Deployment:"
          echo "  ECR Push         : COMPLETED"
          echo "  Cosign Signing   : COMPLETED"

          echo ""
          echo "=================================================="
