
name: Snyk Alpine Scan with PDF Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-scan:
    name: Scan Python Alpine Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Authenticate with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: SNYK_TOKEN secret is missing."
            exit 1
          fi
          snyk auth "$SNYK_TOKEN"

      - name: Pull Python Alpine Image
        run: docker pull python:3.12-alpine

      - name: Run Snyk Container Scan
        id: scan
        continue-on-error: true
        run: |
          snyk container test python:3.12-alpine \
            --json-file-output=snyk-results.json \
            --severity-threshold=high
          RESULT=$?
          echo "Snyk scan exit code: $RESULT"
          exit 0

      - name: Install PDF Dependencies
        if: always()
        run: python -m pip install reportlab

      - name: Generate PDF Report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.units import mm
          from reportlab.platypus import (
              SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          )

          os.makedirs("reports", exist_ok=True)

          json_file = "snyk-results.json"
          pdf_file = "reports/snyk-container-scan-report.pdf"
          data = {}

          if os.path.exists(json_file):
              try:
                  with open(json_file, encoding="utf-8") as f:
                      data = json.load(f)
              except (json.JSONDecodeError, OSError):
                  data = {}

          vulnerabilities = data.get("vulnerabilities", [])
          styles = getSampleStyleSheet()
          styles.add(ParagraphStyle(
              name="ReportTitleCustom",
              parent=styles["Title"],
              fontSize=19,
              leading=23,
              textColor=colors.HexColor("#17365D"),
              spaceAfter=12
          ))
          styles.add(ParagraphStyle(
              name="SmallCustom",
              parent=styles["BodyText"],
              fontSize=7,
              leading=9,
              wordWrap="CJK"
          ))

          doc = SimpleDocTemplate(
              pdf_file,
              pagesize=A4,
              rightMargin=12*mm,
              leftMargin=12*mm,
              topMargin=15*mm,
              bottomMargin=15*mm
          )

          story = [
              Paragraph("Snyk Container Vulnerability Report",
                        styles["ReportTitleCustom"]),
              Paragraph(
                  "Generated: " +
                  datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
                  styles["Normal"]
              ),
              Spacer(1, 6*mm)
          ]

          summary = [
              ["Image", "python:3.12-alpine"],
              ["Platform", "linux/amd64"],
              ["Target OS", "Alpine Linux v3.24 (from supplied scan output)"],
              ["Package manager", "apk"],
              ["Dependencies tested", "38 (from supplied scan output)"],
              ["Issues in JSON report", str(len(vulnerabilities))],
              ["Organization", "veerabalaramaraju"],
              ["Scan data", "JSON available" if data else "JSON unavailable or invalid"],
          ]

          table = Table(summary, colWidths=[48*mm, 125*mm])
          table.setStyle(TableStyle([
              ("BACKGROUND", (0, 0), (0, -1), colors.HexColor("#EAF0F8")),
              ("GRID", (0, 0), (-1, -1), 0.5, colors.grey),
              ("VALIGN", (0, 0), (-1, -1), "TOP"),
              ("LEFTPADDING", (0, 0), (-1, -1), 6),
              ("RIGHTPADDING", (0, 0), (-1, -1), 6),
              ("TOPPADDING", (0, 0), (-1, -1), 5),
              ("BOTTOMPADDING", (0, 0), (-1, -1), 5),
          ]))
          story.extend([
              table,
              Spacer(1, 7*mm),
              Paragraph("Vulnerability Details", styles["Heading2"])
          ])

          if vulnerabilities:
              rows = [[
                  Paragraph("<b>ID</b>", styles["SmallCustom"]),
                  Paragraph("<b>Package</b>", styles["SmallCustom"]),
                  Paragraph("<b>Installed</b>", styles["SmallCustom"]),
                  Paragraph("<b>Severity</b>", styles["SmallCustom"]),
                  Paragraph("<b>Fixed in</b>", styles["SmallCustom"]),
              ]]

              for v in vulnerabilities:
                  fixed = v.get("fixedIn", [])
                  if isinstance(fixed, list):
                      fixed = ", ".join(map(str, fixed)) or "No fix listed"

                  fields = [
                      v.get("id", "Unknown"),
                      v.get("packageName", "Unknown"),
                      v.get("version", "Unknown"),
                      str(v.get("severity", "Unknown")).upper(),
                      fixed
                  ]
                  rows.append([
                      Paragraph(escape(str(x)), styles["SmallCustom"])
                      for x in fields
                  ])

              details = Table(
                  rows,
                  repeatRows=1,
                  colWidths=[28*mm, 42*mm, 27*mm, 23*mm, 53*mm]
              )
              details.setStyle(TableStyle([
                  ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#D9E5F5")),
                  ("GRID", (0, 0), (-1, -1), 0.4, colors.grey),
                  ("VALIGN", (0, 0), (-1, -1), "TOP"),
                  ("LEFTPADDING", (0, 0), (-1, -1), 4),
                  ("RIGHTPADDING", (0, 0), (-1, -1), 4),
                  ("TOPPADDING", (0, 0), (-1, -1), 4),
                  ("BOTTOMPADDING", (0, 0), (-1, -1), 4),
              ]))
              story.append(details)
          else:
              story.append(Paragraph(
                  "No vulnerability details were parsed from the JSON report. "
                  "Check the raw JSON artifact and Snyk scan logs.",
                  styles["BodyText"]
              ))

          story.extend([
              Spacer(1, 6*mm),
              Paragraph("Recommendations", styles["Heading2"]),
              Paragraph(
                  "1. Review the vulnerability ID, affected package and severity.<br/>"
                  "2. Check the fixed version and update the base image or package "
                  "after verifying compatibility.<br/>"
                  "3. Rebuild and rescan the image to confirm remediation.<br/>"
                  "4. Review scan logs if the JSON report is missing or incomplete.",
                  styles["BodyText"]
              )
          ])

          doc.build(story)
          print("PDF report created:", pdf_file)
          PY

      - name: Upload PDF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-pdf-report
          path: reports/snyk-container-scan-report.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-json-report
          path: snyk-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Display Scan Status
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" = "success" ]; then
            echo "Snyk scan completed without exceeding the configured threshold."
          else
            echo "Snyk reported vulnerabilities or encountered a scan error."
            echo "Download the PDF and JSON artifacts to investigate."
          fi

          echo "The workflow is configured to preserve scan reports."
