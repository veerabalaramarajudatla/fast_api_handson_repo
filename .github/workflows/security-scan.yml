name: Secure Build and ECR Push

on:
  workflow_dispatch:

    inputs:

      severity_mode:
        description: "Severity selection mode"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE
        default: ALL

      check_critical:
        description: "SELECTIVE - Check CRITICAL"
        required: true
        type: boolean
        default: true

      check_high:
        description: "SELECTIVE - Check HIGH"
        required: true
        type: boolean
        default: true

      check_medium:
        description: "SELECTIVE - Check MEDIUM"
        required: true
        type: boolean
        default: true

      check_low:
        description: "SELECTIVE - Check LOW"
        required: true
        type: boolean
        default: false

      critical_threshold:
        description: "Maximum allowed CRITICAL vulnerabilities"
        required: true
        type: number
        default: 0

      high_threshold:
        description: "Maximum allowed HIGH vulnerabilities"
        required: true
        type: number
        default: 5

      medium_threshold:
        description: "Maximum allowed MEDIUM vulnerabilities"
        required: true
        type: number
        default: 10

      low_threshold:
        description: "Maximum allowed LOW vulnerabilities"
        required: true
        type: number
        default: 20


permissions:
  contents: read
  issues: write
  id-token: write


# ==============================================================
# GITHUB VARIABLES / SECRETS
# ==============================================================

env:

  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

  APPROVERS: ${{ vars.APPROVERS }}


jobs:

  # ============================================================
  # JOB 1
  # SNYK SECURITY SCAN
  # ============================================================

  security-scan:

    name: Snyk Security Scan and Approval

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout selected branch
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # SHOW REPOSITORY
      # --------------------------------------------------------

      - name: Show repository structure
        run: |

          echo "=========================================="
          echo "Repository"
          echo "=========================================="

          pwd

          echo ""

          find . -maxdepth 4 -type f \
            -not -path "./.git/*" \
            | sort


      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # INSTALL APPLICATION + WORKFLOW DEPENDENCIES
      # IMPORTANT:
      # Do this BEFORE Snyk so a workflow dependency
      # failure doesn't consume another Snyk scan.
      # --------------------------------------------------------

      - name: Install application and workflow dependencies
        working-directory: ./app

        run: |

          echo "=========================================="
          echo "Python"
          echo "=========================================="

          python --version

          echo ""

          echo "=========================================="
          echo "Upgrade pip"
          echo "=========================================="

          python -m pip install --upgrade pip

          echo ""

          echo "=========================================="
          echo "Install application dependencies"
          echo "=========================================="

          python -m pip install -r requirements.txt

          echo ""

          echo "=========================================="
          echo "Install PDF dependency"
          echo "=========================================="

          python -m pip install reportlab

          echo ""

          echo "=========================================="
          echo "Verify ReportLab"
          echo "=========================================="

          python -c "import reportlab; print('ReportLab:', reportlab.Version)"


      # --------------------------------------------------------
      # SNYK CLI
      # --------------------------------------------------------

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master


      - name: Verify Snyk CLI
        run: |

          snyk --version

          echo "Snyk CLI is available."


      # --------------------------------------------------------
      # SNYK SCAN
      #
      # ONLY ONE SNYK TEST
      # --------------------------------------------------------

      - name: Run Snyk vulnerability scan

        id: snyk

        working-directory: ./app

        continue-on-error: true

        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        run: |

          set +e

          echo "=========================================="
          echo "SNYK SECURITY SCAN"
          echo "=========================================="

          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --json-file-output=snyk-report.json

          SNYK_EXIT=$?

          echo ""

          echo "=========================================="
          echo "Snyk Exit Code: $SNYK_EXIT"
          echo "=========================================="

          if [ "$SNYK_EXIT" -eq 0 ]; then

            echo "No vulnerabilities detected."

          elif [ "$SNYK_EXIT" -eq 1 ]; then

            echo "Vulnerabilities detected."

          else

            echo "Snyk execution/configuration error."

          fi

          exit 0


      # --------------------------------------------------------
      # VERIFY REPORT
      # --------------------------------------------------------

      - name: Validate Snyk report

        run: |

          echo "Checking Snyk report..."

          if [ ! -f "app/snyk-report.json" ]; then

            echo "ERROR: snyk-report.json was not generated."

            echo ""

            find app -maxdepth 2 -type f | sort

            exit 1

          fi

          echo ""

          echo "Snyk report found."

          ls -lh app/snyk-report.json


      # --------------------------------------------------------
      # COPY REPORT
      # --------------------------------------------------------

      - name: Prepare Snyk report

        run: |

          cp app/snyk-report.json ./snyk-report.json

          ls -lh snyk-report.json


      # --------------------------------------------------------
      # EVALUATE VULNERABILITIES
      # --------------------------------------------------------

      - name: Evaluate security thresholds

        id: evaluate

        env:

          SEVERITY_MODE: ${{ inputs.severity_mode }}

          CHECK_CRITICAL: ${{ inputs.check_critical }}
          CHECK_HIGH: ${{ inputs.check_high }}
          CHECK_MEDIUM: ${{ inputs.check_medium }}
          CHECK_LOW: ${{ inputs.check_low }}

          CRITICAL_THRESHOLD: ${{ inputs.critical_threshold }}
          HIGH_THRESHOLD: ${{ inputs.high_threshold }}
          MEDIUM_THRESHOLD: ${{ inputs.medium_threshold }}
          LOW_THRESHOLD: ${{ inputs.low_threshold }}

        run: |

          python <<'PY'

          import json
          import os


          # --------------------------------------------------
          # LOAD SNYK REPORT
          # --------------------------------------------------

          with open(
              "snyk-report.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          vulnerabilities = data.get(
              "vulnerabilities",
              []
          )


          # --------------------------------------------------
          # COUNT
          # --------------------------------------------------

          counts = {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0
          }


          for vulnerability in vulnerabilities:

              severity = str(
                  vulnerability.get(
                      "severity",
                      ""
                  )
              ).lower()


              if severity in counts:

                  counts[severity] += 1


          # --------------------------------------------------
          # MODE
          # --------------------------------------------------

          mode = os.environ[
              "SEVERITY_MODE"
          ]


          selected = {
              "critical": True,
              "high": True,
              "medium": True,
              "low": True
          }


          if mode == "SELECTIVE":

              selected = {

                  "critical":
                      os.environ[
                          "CHECK_CRITICAL"
                      ].lower() == "true",

                  "high":
                      os.environ[
                          "CHECK_HIGH"
                      ].lower() == "true",

                  "medium":
                      os.environ[
                          "CHECK_MEDIUM"
                      ].lower() == "true",

                  "low":
                      os.environ[
                          "CHECK_LOW"
                      ].lower() == "true"
              }


          # --------------------------------------------------
          # THRESHOLDS
          # --------------------------------------------------

          thresholds = {

              "critical":
                  int(
                      os.environ[
                          "CRITICAL_THRESHOLD"
                      ]
                  ),

              "high":
                  int(
                      os.environ[
                          "HIGH_THRESHOLD"
                      ]
                  ),

              "medium":
                  int(
                      os.environ[
                          "MEDIUM_THRESHOLD"
                      ]
                  ),

              "low":
                  int(
                      os.environ[
                          "LOW_THRESHOLD"
                      ]
                  )
          }


          # --------------------------------------------------
          # CHECK
          # --------------------------------------------------

          failures = []


          for severity in counts:

              if not selected[severity]:

                  continue


              if (
                  counts[severity]
                  >
                  thresholds[severity]
              ):

                  failures.append(
                      severity
                  )


          security_status = (
              "FAIL"
              if failures
              else
              "PASS"
          )


          # --------------------------------------------------
          # GITHUB OUTPUT
          # --------------------------------------------------

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:

              output.write(
                  f"security_status={security_status}\n"
              )

              output.write(
                  f"critical_count={counts['critical']}\n"
              )

              output.write(
                  f"high_count={counts['high']}\n"
              )

              output.write(
                  f"medium_count={counts['medium']}\n"
              )

              output.write(
                  f"low_count={counts['low']}\n"
              )


          # --------------------------------------------------
          # PRINT SUMMARY
          # --------------------------------------------------

          print("")
          print("==========================================")
          print("SNYK SECURITY SUMMARY")
          print("==========================================")

          print(
              f"Repository: "
              f"{os.environ.get('GITHUB_REPOSITORY')}"
          )

          print(
              f"Branch: "
              f"{os.environ.get('GITHUB_REF_NAME')}"
          )

          print(
              f"Mode: {mode}"
          )

          print("")

          for severity in [
              "critical",
              "high",
              "medium",
              "low"
          ]:

              if not selected[severity]:

                  status = "NOT SELECTED"

              elif (
                  counts[severity]
                  <=
                  thresholds[severity]
              ):

                  status = "PASS"

              else:

                  status = "FAIL"


              print(
                  f"{severity.upper():10} "
                  f"Found={counts[severity]:3} "
                  f"Threshold={thresholds[severity]:3} "
                  f"Status={status}"
              )


          print("")

          print(
              f"SECURITY GATE: "
              f"{security_status}"
          )

          print(
              "=========================================="
          )


          # --------------------------------------------------
          # TEXT SUMMARY
          # --------------------------------------------------

          with open(
              "security-summary.txt",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "SNYK SECURITY SUMMARY\n\n"
              )

              file.write(
                  f"Repository: "
                  f"{os.environ.get('GITHUB_REPOSITORY')}\n"
              )

              file.write(
                  f"Branch: "
                  f"{os.environ.get('GITHUB_REF_NAME')}\n"
              )

              file.write(
                  f"Mode: {mode}\n\n"
              )

              for severity in [
                  "critical",
                  "high",
                  "medium",
                  "low"
              ]:

                  file.write(
                      f"{severity.upper()}: "
                      f"{counts[severity]} "
                      f"/ "
                      f"{thresholds[severity]}\n"
                  )

              file.write(
                  f"\nSecurity Gate: "
                  f"{security_status}\n"
              )


          # --------------------------------------------------
          # GITHUB STEP SUMMARY
          # --------------------------------------------------

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as summary:

              summary.write(
                  "# 🔐 Snyk Security Summary\n\n"
              )

              summary.write(
                  f"**Repository:** "
                  f"`{os.environ.get('GITHUB_REPOSITORY')}`\n\n"
              )

              summary.write(
                  f"**Branch:** "
                  f"`{os.environ.get('GITHUB_REF_NAME')}`\n\n"
              )

              summary.write(
                  f"**Mode:** `{mode}`\n\n"
              )

              summary.write(
                  "| Severity | Found | Threshold | Status |\n"
              )

              summary.write(
                  "|---|---:|---:|---|\n"
              )


              for severity in [
                  "critical",
                  "high",
                  "medium",
                  "low"
              ]:

                  if not selected[severity]:

                      status = "NOT SELECTED"
                      threshold = "-"

                  elif (
                      counts[severity]
                      <=
                      thresholds[severity]
                  ):

                      status = "PASS"
                      threshold = thresholds[severity]

                  else:

                      status = "FAIL"
                      threshold = thresholds[severity]


                  summary.write(
                      f"| {severity.upper()} | "
                      f"{counts[severity]} | "
                      f"{threshold} | "
                      f"{status} |\n"
                  )


              summary.write(
                  f"\n## Overall Security Gate: "
                  f"**{security_status}**\n"
              )

          PY


      # --------------------------------------------------------
      # PDF
      # --------------------------------------------------------

      - name: Generate PDF vulnerability report

        run: |

          python <<'PY'

          import json
          import os

          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet

          from reportlab.platypus import (
              SimpleDocTemplate,
              Paragraph,
              Spacer,
              Table,
              TableStyle
          )


          with open(
              "snyk-report.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          vulnerabilities = data.get(
              "vulnerabilities",
              []
          )


          counts = {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0
          }


          for vulnerability in vulnerabilities:

              severity = str(
                  vulnerability.get(
                      "severity",
                      ""
                  )
              ).lower()


              if severity in counts:

                  counts[severity] += 1


          pdf_file = (
              "snyk-vulnerability-report.pdf"
          )


          document = SimpleDocTemplate(
              pdf_file,
              pagesize=A4,
              rightMargin=30,
              leftMargin=30,
              topMargin=30,
              bottomMargin=30
          )


          styles = getSampleStyleSheet()

          story = []


          story.append(
              Paragraph(
                  "Snyk Vulnerability Security Report",
                  styles["Title"]
              )
          )


          story.append(
              Spacer(1, 15)
          )


          story.append(
              Paragraph(
                  f"Repository: "
                  f"{os.environ.get('GITHUB_REPOSITORY')}",
                  styles["Normal"]
              )
          )


          story.append(
              Paragraph(
                  f"Branch: "
                  f"{os.environ.get('GITHUB_REF_NAME')}",
                  styles["Normal"]
              )
          )


          story.append(
              Paragraph(
                  f"Commit: "
                  f"{os.environ.get('GITHUB_SHA')}",
                  styles["Normal"]
              )
          )


          story.append(
              Spacer(1, 20)
          )


          story.append(
              Paragraph(
                  "Vulnerability Summary",
                  styles["Heading2"]
              )
          )


          summary_data = [
              ["Severity", "Count"],
              ["Critical", counts["critical"]],
              ["High", counts["high"]],
              ["Medium", counts["medium"]],
              ["Low", counts["low"]]
          ]


          summary_table = Table(
              summary_data,
              colWidths=[250, 100]
          )


          summary_table.setStyle(
              TableStyle([
                  (
                      "BACKGROUND",
                      (0, 0),
                      (-1, 0),
                      colors.lightgrey
                  ),
                  (
                      "GRID",
                      (0, 0),
                      (-1, -1),
                      1,
                      colors.black
                  ),
                  (
                      "FONTNAME",
                      (0, 0),
                      (-1, 0),
                      "Helvetica-Bold"
                  ),
                  (
                      "ALIGN",
                      (1, 1),
                      (-1, -1),
                      "CENTER"
                  )
              ])
          )


          story.append(summary_table)


          story.append(
              Spacer(1, 20)
          )


          story.append(
              Paragraph(
                  "Detailed Vulnerabilities",
                  styles["Heading2"]
              )
          )


          detail_data = [
              [
                  "Severity",
                  "Package",
                  "Version",
                  "Issue"
              ]
          ]


          for vulnerability in vulnerabilities:

              detail_data.append([
                  vulnerability.get(
                      "severity",
                      ""
                  ),

                  vulnerability.get(
                      "packageName",
                      ""
                  ),

                  vulnerability.get(
                      "version",
                      ""
                  ),

                  vulnerability.get(
                      "title",
                      ""
                  )[:100]
              ])


          if len(detail_data) == 1:

              detail_data.append([
                  "-",
                  "-",
                  "-",
                  "No vulnerabilities found"
              ])


          detail_table = Table(
              detail_data,
              repeatRows=1,
              colWidths=[
                  65,
                  120,
                  65,
                  240
              ]
          )


          detail_table.setStyle(
              TableStyle([
                  (
                      "BACKGROUND",
                      (0, 0),
                      (-1, 0),
                      colors.lightgrey
                  ),
                  (
                      "GRID",
                      (0, 0),
                      (-1, -1),
                      0.5,
                      colors.grey
                  ),
                  (
                      "FONTNAME",
                      (0, 0),
                      (-1, 0),
                      "Helvetica-Bold"
                  ),
                  (
                      "FONTSIZE",
                      (0, 0),
                      (-1, -1),
                      7
                  ),
                  (
                      "VALIGN",
                      (0, 0),
                      (-1, -1),
                      "TOP"
                  )
              ])
          )


          story.append(detail_table)


          document.build(story)


          print(
              f"Generated: {pdf_file}"
          )

          PY


      # --------------------------------------------------------
      # ARTIFACT
      # --------------------------------------------------------

      - name: Upload security reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: snyk-security-report

          path: |
            snyk-vulnerability-report.pdf
            snyk-report.json
            security-summary.txt

          retention-days: 30


      # --------------------------------------------------------
      # APPROVAL BODY
      # --------------------------------------------------------

      - name: Prepare approval request

        run: |

          cat > approval-body.md <<EOF

          # 🔐 Security Approval Required

          ## Build Information

          | Item | Value |
          |---|---|
          | Repository | \`${GITHUB_REPOSITORY}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | Workflow Run | ${GITHUB_RUN_ID} |
          | Requested By | @${GITHUB_ACTOR} |

          ---

          ## Snyk Vulnerability Summary

          | Severity | Found | Threshold |
          |---|---:|---:|
          | CRITICAL | ${{ steps.evaluate.outputs.critical_count }} | ${{ inputs.critical_threshold }} |
          | HIGH | ${{ steps.evaluate.outputs.high_count }} | ${{ inputs.high_threshold }} |
          | MEDIUM | ${{ steps.evaluate.outputs.medium_count }} | ${{ inputs.medium_threshold }} |
          | LOW | ${{ steps.evaluate.outputs.low_count }} | ${{ inputs.low_threshold }} |

          ### Security Gate

          **${{ steps.evaluate.outputs.security_status }}**

          ---

          ## Full Report

          Open the workflow run:

          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Download:

          **snyk-security-report**

          The artifact contains:

          - snyk-vulnerability-report.pdf
          - snyk-report.json
          - security-summary.txt

          ---

          ## Approval

          To approve:

          \`APPROVE\`

          To decline:

          \`DECLINE\`

          ---

          If approved:

          Docker Build → ECR Push → Cosign

          If declined:

          Pipeline STOPPED

          EOF


      # --------------------------------------------------------
      # MANUAL APPROVAL
      # --------------------------------------------------------

      - name: Wait for security approval

        uses: trstringer/manual-approval@v1

        timeout-minutes: 360

        with:

          secret: ${{ github.token }}

          approvers: ${{ env.APPROVERS }}

          minimum-approvals: 1

          issue-title: >
            🔐 Security Approval -
            ${{ github.repository }} -
            ${{ github.ref_name }}

          issue-body-file-path: approval-body.md

          exclude-workflow-initiator-as-approver: false

          fail-on-denial: true

          additional-approved-words: "APPROVE"

          additional-denied-words: "DECLINE"

          polling-interval-seconds: 15


  # ============================================================
  # JOB 2
  # DOCKER → ECR → COSIGN
  # ============================================================

  build-push-sign:

    name: Build, Push and Sign

    needs: security-scan

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT EXACT COMMIT THAT WAS SCANNED
      # --------------------------------------------------------

      - name: Checkout scanned commit

        uses: actions/checkout@v4

        with:

          ref: ${{ github.sha }}


      # --------------------------------------------------------
      # VERIFY DOCKERFILE
      # --------------------------------------------------------

      - name: Verify Docker files

        run: |

          echo "=========================================="
          echo "Dockerfile"
          echo "=========================================="

          if [ ! -f "app/Dockerfile" ]; then

            echo "ERROR: app/Dockerfile does not exist."

            exit 1

          fi

          echo ""

          echo "Dockerfile size:"

          wc -c app/Dockerfile

          echo ""

          echo "Dockerfile contents:"

          cat app/Dockerfile


      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ env.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}

          role-session-name: GitHubActionsSecurityPOC

          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}


      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # --------------------------------------------------------
      # ECR LOGIN
      # --------------------------------------------------------

      - name: Login to Amazon ECR

        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # IMAGE NAME
      # --------------------------------------------------------

      - name: Generate Docker image information

        id: image

        run: |

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"

          SHORT_SHA="${GITHUB_SHA::12}"

          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')

          IMAGE_TAG="${SAFE_BRANCH}-${SHORT_SHA}"


          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"


          echo ""

          echo "Image:"

          echo "${IMAGE_URI}:${IMAGE_TAG}"


      # --------------------------------------------------------
      # DOCKER BUILD
      # --------------------------------------------------------

      - name: Build Docker image

        run: |

          docker build \
            -f app/Dockerfile \
            -t "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}" \
            ./app


      # --------------------------------------------------------
      # PUSH
      # --------------------------------------------------------

      - name: Push Docker image to ECR

        run: |

          docker push \
            "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}"


      # --------------------------------------------------------
      # COSIGN
      # --------------------------------------------------------

      - name: Install Cosign

        uses: sigstore/cosign-installer@v3


      - name: Sign Docker image with Cosign

        env:

          COSIGN_YES: "true"

        run: |

          cosign sign \
            "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}"


      # --------------------------------------------------------
      # GET DIGEST
      # --------------------------------------------------------

      - name: Get ECR image digest

        id: digest

        run: |

          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${{ steps.image.outputs.image_tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)


          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"


          echo ""

          echo "=========================================="

          echo "FINAL IMAGE"

          echo "=========================================="

          echo "Repository:"

          echo "${{ steps.image.outputs.image_uri }}"

          echo ""

          echo "Tag:"

          echo "${{ steps.image.outputs.image_tag }}"

          echo ""

          echo "Digest:"

          echo "${DIGEST}"

          echo ""

          echo "Cosign: SIGNED"

          echo "=========================================="


      # --------------------------------------------------------
      # FINAL SUMMARY
      # --------------------------------------------------------

      - name: Final deployment summary

        run: |

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          # 🚀 Secure Image Published

          | Item | Value |
          |---|---|
          | Repository | \`${{ steps.image.outputs.image_uri }}\` |
          | Tag | \`${{ steps.image.outputs.image_tag }}\` |
          | Digest | \`${{ steps.digest.outputs.digest }}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | Security Approval | ✅ APPROVED |
          | Docker Build | ✅ SUCCESS |
