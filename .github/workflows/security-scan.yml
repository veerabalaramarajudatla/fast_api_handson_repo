name: Secure Build and ECR Push

on:
  workflow_dispatch:
    inputs:

      severity_mode:
        description: "Severity selection mode"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE
        default: ALL

      check_critical:
        description: "SELECTIVE - Check CRITICAL"
        required: true
        type: boolean
        default: true

      check_high:
        description: "SELECTIVE - Check HIGH"
        required: true
        type: boolean
        default: true

      check_medium:
        description: "SELECTIVE - Check MEDIUM"
        required: true
        type: boolean
        default: true

      check_low:
        description: "SELECTIVE - Check LOW"
        required: true
        type: boolean
        default: false

      critical_threshold:
        description: "Maximum allowed CRITICAL vulnerabilities"
        required: true
        type: number
        default: 0

      high_threshold:
        description: "Maximum allowed HIGH vulnerabilities"
        required: true
        type: number
        default: 5

      medium_threshold:
        description: "Maximum allowed MEDIUM vulnerabilities"
        required: true
        type: number
        default: 10

      low_threshold:
        description: "Maximum allowed LOW vulnerabilities"
        required: true
        type: number
        default: 20


# ==============================================================
# GITHUB PERMISSIONS
# ==============================================================

permissions:
  contents: read
  issues: write
  id-token: write


# ==============================================================
# GLOBAL ENVIRONMENT
# ==============================================================

env:

  AWS_REGION: ap-south-1

  AWS_ACCOUNT_ID: "570865379429"

  ECR_REPOSITORY: achala-poc-python-app

  AWS_ROLE_ARN: arn:aws:iam::570865379429:role/GitHub-Achala-POC-ECR-Role

  # GitHub username who can approve.
  APPROVERS: veerabalaramarajudatla


# ==============================================================
# JOB 1
# SNYK → EVALUATION → PDF → APPROVAL
# ==============================================================

jobs:

  security-scan:

    name: Snyk Security Scan and Approval

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. CHECKOUT SELECTED BRANCH
      # ----------------------------------------------------------

      - name: Checkout selected branch
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. SHOW REPOSITORY STRUCTURE
      # ----------------------------------------------------------

      - name: Show repository structure
        run: |

          echo "=========================================="
          echo "Repository"
          echo "=========================================="

          pwd

          echo ""

          echo "Files:"

          find . -maxdepth 4 -type f \
            -not -path "./.git/*" \
            | sort


      # ----------------------------------------------------------
      # 3. SETUP PYTHON
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ----------------------------------------------------------
      # 4. INSTALL APPLICATION DEPENDENCIES
      #
      # Your requirements.txt is:
      #
      # app/requirements.txt
      #
      # Snyk needs the Python dependency information resolved.
      # ----------------------------------------------------------

      - name: Install workflow and application dependencies
        working-directory: ./app
        run: |
          echo "=========================================="
          echo "Python Version"
          echo "=========================================="
          python --version
      
          echo ""
          echo "=========================================="
          echo "Upgrading pip"
          echo "=========================================="
          python -m pip install --upgrade pip
      
          echo ""
          echo "=========================================="
          echo "Installing Application Dependencies"
          echo "=========================================="
          python -m pip install -r requirements.txt
      
          echo ""
          echo "=========================================="
          echo "Installing PDF Report Dependency"
          echo "=========================================="
          python -m pip install reportlab
      
          echo ""
          echo "=========================================="
          echo "Verifying ReportLab"
          echo "=========================================="
          python -c "import reportlab; print('ReportLab version:', reportlab.Version)"
      
          echo ""
          echo "=========================================="
          echo "Installed Packages"
          echo "=========================================="
          python -m pip list


      # ----------------------------------------------------------
      # 5. SETUP SNYK
      # ----------------------------------------------------------

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master


      # ----------------------------------------------------------
      # 6. VERIFY SNYK
      # ----------------------------------------------------------

      - name: Verify Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          snyk --version

          echo "Snyk CLI is available."


      # ----------------------------------------------------------
      # 7. RUN SNYK
      #
      # IMPORTANT:
      #
      # We DO NOT use:
      #
      # --severity-threshold
      #
      # because we want ALL vulnerabilities.
      #
      # Our own evaluator will apply the user's selected
      # thresholds.
      # ----------------------------------------------------------

      - name: Run Snyk vulnerability scan
        id: snyk
        working-directory: ./app
        continue-on-error: true

        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        run: |

          set +e

          echo "=========================================="
          echo "Running Snyk"
          echo "=========================================="

          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --json-file-output=snyk-report.json

          SNYK_EXIT=$?

          echo ""

          echo "=========================================="
          echo "Snyk Exit Code: $SNYK_EXIT"
          echo "=========================================="

          if [ "$SNYK_EXIT" -eq 0 ]; then
            echo "No vulnerabilities detected by Snyk."
          elif [ "$SNYK_EXIT" -eq 1 ]; then
            echo "Vulnerabilities detected by Snyk."
          else
            echo "Snyk returned an execution/configuration error."
          fi

          # Do not fail here.
          #
          # The report will be evaluated by our own
          # security threshold logic.

          exit 0


      # ----------------------------------------------------------
      # 8. CHECK SNYK REPORT
      # ----------------------------------------------------------

      - name: Validate Snyk report
        run: |

          echo "Checking Snyk report..."

          if [ ! -f "app/snyk-report.json" ]; then

            echo ""
            echo "ERROR: snyk-report.json was not generated."
            echo ""

            echo "Contents of app directory:"

            find app -maxdepth 2 -type f | sort

            exit 1

          fi

          echo ""

          echo "Snyk report found."

          ls -lh app/snyk-report.json


      # ----------------------------------------------------------
      # 9. COPY REPORT TO ROOT
      # ----------------------------------------------------------

      - name: Prepare Snyk report
        run: |

          cp app/snyk-report.json ./snyk-report.json

          echo "Report copied to repository root."

          ls -lh snyk-report.json


      # ----------------------------------------------------------
      # 10. EVALUATE VULNERABILITY THRESHOLDS
      # ----------------------------------------------------------

      - name: Evaluate security thresholds
        id: evaluate

        env:

          SEVERITY_MODE: ${{ inputs.severity_mode }}

          CHECK_CRITICAL: ${{ inputs.check_critical }}

          CHECK_HIGH: ${{ inputs.check_high }}

          CHECK_MEDIUM: ${{ inputs.check_medium }}

          CHECK_LOW: ${{ inputs.check_low }}

          CRITICAL_THRESHOLD: ${{ inputs.critical_threshold }}

          HIGH_THRESHOLD: ${{ inputs.high_threshold }}

          MEDIUM_THRESHOLD: ${{ inputs.medium_threshold }}

          LOW_THRESHOLD: ${{ inputs.low_threshold }}

        run: |

          python <<'PY'

          import json
          import os


          # ------------------------------------------------------
          # LOAD SNYK REPORT
          # ------------------------------------------------------

          with open(
              "snyk-report.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          vulnerabilities = data.get(
              "vulnerabilities",
              []
          )


          # ------------------------------------------------------
          # COUNT SEVERITIES
          # ------------------------------------------------------

          counts = {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0
          }


          for vulnerability in vulnerabilities:

              severity = str(
                  vulnerability.get(
                      "severity",
                      ""
                  )
              ).lower()


              if severity in counts:

                  counts[severity] += 1


          # ------------------------------------------------------
          # MODE
          # ------------------------------------------------------

          mode = os.environ[
              "SEVERITY_MODE"
          ]


          # ALL MODE
          # ------------------------------------------------------

          selected = {
              "critical": True,
              "high": True,
              "medium": True,
              "low": True
          }


          # SELECTIVE MODE
          # ------------------------------------------------------

          if mode == "SELECTIVE":

              selected = {

                  "critical":
                      os.environ[
                          "CHECK_CRITICAL"
                      ].lower() == "true",

                  "high":
                      os.environ[
                          "CHECK_HIGH"
                      ].lower() == "true",

                  "medium":
                      os.environ[
                          "CHECK_MEDIUM"
                      ].lower() == "true",

                  "low":
                      os.environ[
                          "CHECK_LOW"
                      ].lower() == "true"
              }


          # ------------------------------------------------------
          # THRESHOLDS
          # ------------------------------------------------------

          thresholds = {

              "critical":
                  int(
                      os.environ[
                          "CRITICAL_THRESHOLD"
                      ]
                  ),

              "high":
                  int(
                      os.environ[
                          "HIGH_THRESHOLD"
                      ]
                  ),

              "medium":
                  int(
                      os.environ[
                          "MEDIUM_THRESHOLD"
                      ]
                  ),

              "low":
                  int(
                      os.environ[
                          "LOW_THRESHOLD"
                      ]
                  )
          }


          # ------------------------------------------------------
          # SECURITY GATE
          # ------------------------------------------------------

          failures = []


          for severity in counts:

              if not selected[severity]:

                  continue


              if (
                  counts[severity]
                  >
                  thresholds[severity]
              ):

                  failures.append(
                      severity
                  )


          if failures:

              security_status = "FAIL"

          else:

              security_status = "PASS"


          # ------------------------------------------------------
          # GITHUB OUTPUTS
          # ------------------------------------------------------

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:

              output.write(
                  f"security_status={security_status}\n"
              )

              output.write(
                  f"critical_count={counts['critical']}\n"
              )

              output.write(
                  f"high_count={counts['high']}\n"
              )

              output.write(
                  f"medium_count={counts['medium']}\n"
              )

              output.write(
                  f"low_count={counts['low']}\n"
              )


          # ------------------------------------------------------
          # CREATE SUMMARY
          # ------------------------------------------------------

          def status_for(
              severity
          ):

              if not selected[severity]:

                  return "NOT SELECTED"


              if (
                  counts[severity]
                  <=
                  thresholds[severity]
              ):

                  return "PASS"

              return "FAIL"


          summary = f"""

          ==========================================
                 SNYK SECURITY SUMMARY
          ==========================================

          Repository:
          {os.environ.get("GITHUB_REPOSITORY")}

          Branch:
          {os.environ.get("GITHUB_REF_NAME")}

          Commit:
          {os.environ.get("GITHUB_SHA")}

          Severity Mode:
          {mode}


          ------------------------------------------
          Vulnerability Results
          ------------------------------------------

          CRITICAL : {counts["critical"]}
          Threshold: {thresholds["critical"]}
          Status   : {status_for("critical")}

          HIGH     : {counts["high"]}
          Threshold: {thresholds["high"]}
          Status   : {status_for("high")}

          MEDIUM   : {counts["medium"]}
          Threshold: {thresholds["medium"]}
          Status   : {status_for("medium")}

          LOW      : {counts["low"]}
          Threshold: {thresholds["low"]}
          Status   : {status_for("low")}


          ------------------------------------------
          SECURITY GATE: {security_status}
          ------------------------------------------

          """

          print(summary)


          with open(
              "security-summary.txt",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(summary)


          # ------------------------------------------------------
          # GITHUB ACTION SUMMARY
          # ------------------------------------------------------

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as summary_file:

              summary_file.write(
                  "# 🔐 Snyk Security Summary\n\n"
              )

              summary_file.write(
                  f"**Repository:** "
                  f"`{os.environ.get('GITHUB_REPOSITORY')}`\n\n"
              )

              summary_file.write(
                  f"**Branch:** "
                  f"`{os.environ.get('GITHUB_REF_NAME')}`\n\n"
              )

              summary_file.write(
                  f"**Commit:** "
                  f"`{os.environ.get('GITHUB_SHA')}`\n\n"
              )

              summary_file.write(
                  f"**Mode:** `{mode}`\n\n"
              )

              summary_file.write(
                  "| Severity | Found | Threshold | Status |\n"
              )

              summary_file.write(
                  "|---|---:|---:|---|\n"
              )


              for severity in [
                  "critical",
                  "high",
                  "medium",
                  "low"
              ]:

                  status = status_for(
                      severity
                  )

                  threshold = (
                      thresholds[severity]
                      if selected[severity]
                      else "-"
                  )

                  summary_file.write(
                      f"| {severity.upper()} | "
                      f"{counts[severity]} | "
                      f"{threshold} | "
                      f"{status} |\n"
                  )


              summary_file.write(
                  f"\n## Overall Security Gate: "
                  f"**{security_status}**\n"
              )

          PY


      # ----------------------------------------------------------
      # 11. GENERATE PDF
      # ----------------------------------------------------------

      - name: Generate PDF vulnerability report
        run: |

          python <<'PY'

          import json
          import os

          from reportlab.lib import colors

          from reportlab.lib.pagesizes import A4

          from reportlab.lib.styles import (
              getSampleStyleSheet
          )

          from reportlab.platypus import (
              SimpleDocTemplate,
              Paragraph,
              Spacer,
              Table,
              TableStyle
          )


          # ------------------------------------------------------
          # LOAD REPORT
          # ------------------------------------------------------

          with open(
              "snyk-report.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          vulnerabilities = data.get(
              "vulnerabilities",
              []
          )


          # ------------------------------------------------------
          # COUNT
          # ------------------------------------------------------

          counts = {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0
          }


          for vulnerability in vulnerabilities:

              severity = str(
                  vulnerability.get(
                      "severity",
                      ""
                  )
              ).lower()


              if severity in counts:

                  counts[severity] += 1


          # ------------------------------------------------------
          # PDF
          # ------------------------------------------------------

          pdf_file = (
              "snyk-vulnerability-report.pdf"
          )


          document = SimpleDocTemplate(
              pdf_file,
              pagesize=A4,
              rightMargin=30,
              leftMargin=30,
              topMargin=30,
              bottomMargin=30
          )


          styles = getSampleStyleSheet()

          story = []


          story.append(
              Paragraph(
                  "Snyk Vulnerability Security Report",
                  styles["Title"]
              )
          )


          story.append(
              Spacer(1, 15)
          )


          story.append(
              Paragraph(
                  f"Repository: "
                  f"{os.environ.get('GITHUB_REPOSITORY')}",
                  styles["Normal"]
              )
          )


          story.append(
              Paragraph(
                  f"Branch: "
                  f"{os.environ.get('GITHUB_REF_NAME')}",
                  styles["Normal"]
              )
          )


          story.append(
              Paragraph(
                  f"Commit: "
                  f"{os.environ.get('GITHUB_SHA')}",
                  styles["Normal"]
              )
          )


          story.append(
              Spacer(1, 20)
          )


          story.append(
              Paragraph(
                  "Vulnerability Summary",
                  styles["Heading2"]
              )
          )


          summary_data = [

              [
                  "Severity",
                  "Count"
              ],

              [
                  "Critical",
                  counts["critical"]
              ],

              [
                  "High",
                  counts["high"]
              ],

              [
                  "Medium",
                  counts["medium"]
              ],

              [
                  "Low",
                  counts["low"]
              ]
          ]


          summary_table = Table(
              summary_data,
              colWidths=[
                  250,
                  100
              ]
          )


          summary_table.setStyle(
              TableStyle([

                  (
                      "BACKGROUND",
                      (0, 0),
                      (-1, 0),
                      colors.lightgrey
                  ),

                  (
                      "GRID",
                      (0, 0),
                      (-1, -1),
                      1,
                      colors.black
                  ),

                  (
                      "FONTNAME",
                      (0, 0),
                      (-1, 0),
                      "Helvetica-Bold"
                  ),

                  (
                      "ALIGN",
                      (1, 1),
                      (-1, -1),
                      "CENTER"
                  )
              ])
          )


          story.append(
              summary_table
          )


          story.append(
              Spacer(1, 20)
          )


          # ------------------------------------------------------
          # DETAILED VULNERABILITIES
          # ------------------------------------------------------

          story.append(
              Paragraph(
                  "Detailed Vulnerabilities",
                  styles["Heading2"]
              )
          )


          detail_data = [

              [
                  "Severity",
                  "Package",
                  "Version",
                  "Issue"
              ]
          ]


          for vulnerability in vulnerabilities:

              severity = vulnerability.get(
                  "severity",
                  ""
              )

              package = vulnerability.get(
                  "packageName",
                  ""
              )

              version = vulnerability.get(
                  "version",
                  ""
              )

              title = vulnerability.get(
                  "title",
                  ""
              )


              detail_data.append([

                  severity,

                  package,

                  version,

                  title[:100]
              ])


          if len(detail_data) == 1:

              detail_data.append([

                  "-",

                  "-",

                  "-",

                  "No vulnerabilities found"
              ])


          detail_table = Table(
              detail_data,
              repeatRows=1,
              colWidths=[
                  65,
                  120,
                  65,
                  240
              ]
          )


          detail_table.setStyle(
              TableStyle([

                  (
                      "BACKGROUND",
                      (0, 0),
                      (-1, 0),
                      colors.lightgrey
                  ),

                  (
                      "GRID",
                      (0, 0),
                      (-1, -1),
                      0.5,
                      colors.grey
                  ),

                  (
                      "FONTNAME",
                      (0, 0),
                      (-1, 0),
                      "Helvetica-Bold"
                  ),

                  (
                      "FONTSIZE",
                      (0, 0),
                      (-1, -1),
                      7
                  ),

                  (
                      "VALIGN",
                      (0, 0),
                      (-1, -1),
                      "TOP"
                  )
              ])
          )


          story.append(
              detail_table
          )


          document.build(
              story
          )


          print(
              f"Generated: {pdf_file}"
          )

          PY


      # ----------------------------------------------------------
      # 12. UPLOAD PDF / JSON AS ARTIFACT
      # ----------------------------------------------------------

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: snyk-security-report

          path: |

            snyk-vulnerability-report.pdf

            snyk-report.json

            security-summary.txt

          retention-days: 30


      # ----------------------------------------------------------
      # 13. CREATE APPROVAL MESSAGE
      # ----------------------------------------------------------

      - name: Prepare approval request
        run: |

          cat > approval-body.md <<EOF

          # 🔐 Security Approval Required

          ## Build Information

          | Item | Value |
          |---|---|
          | Repository | \`${GITHUB_REPOSITORY}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | Workflow | ${GITHUB_RUN_ID} |
          | Requested By | @${GITHUB_ACTOR} |

          ---

          ## Snyk Vulnerability Summary

          | Severity | Found | Threshold |
          |---|---:|---:|
          | 🔴 CRITICAL | ${{ steps.evaluate.outputs.critical_count }} | ${{ inputs.critical_threshold }} |
          | 🟠 HIGH | ${{ steps.evaluate.outputs.high_count }} | ${{ inputs.high_threshold }} |
          | 🟡 MEDIUM | ${{ steps.evaluate.outputs.medium_count }} | ${{ inputs.medium_threshold }} |
          | 🟢 LOW | ${{ steps.evaluate.outputs.low_count }} | ${{ inputs.low_threshold }} |

          ### Security Gate

          **${{ steps.evaluate.outputs.security_status }}**

          ---

          ## Full Report

          Open the GitHub Actions run:

          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Download:

          **snyk-security-report**

          The artifact contains:

          - \`snyk-vulnerability-report.pdf\`
          - \`snyk-report.json\`
          - \`security-summary.txt\`

          ---

          ## Approval Decision

          Review the report before making the decision.

          ### To approve

          Comment:

          \`APPROVE\`

          ### To decline

          Comment:

          \`DECLINE\`

          ---

          If approved:

          \`\`\`
          Docker Build
              ↓
          ECR Push
              ↓
          Cosign Signing
          \`\`\`

          If declined:

          \`\`\`
          Pipeline STOPPED
          \`\`\`

          EOF


      # ----------------------------------------------------------
      # 14. MANUAL APPROVAL
      # ----------------------------------------------------------

      - name: Wait for security approval
        uses: trstringer/manual-approval@v1

        timeout-minutes: 360

        with:

          secret: ${{ github.token }}

          approvers: ${{ env.APPROVERS }}

          minimum-approvals: 1

          issue-title: >
            🔐 Security Approval -
            ${{ github.repository }} -
            ${{ github.ref_name }}

          issue-body-file-path: approval-body.md

          exclude-workflow-initiator-as-approver: false

          fail-on-denial: true

          additional-approved-words: "APPROVE"

          additional-denied-words: "DECLINE"

          polling-interval-seconds: 15


  # ==============================================================
  # JOB 2
  # DOCKER BUILD → ECR PUSH → COSIGN
  # ==============================================================

  build-push-sign:

    name: Build, Push and Sign

    needs: security-scan

    runs-on: ubuntu-latest

    steps:


      # ----------------------------------------------------------
      # 15. CHECKOUT EXACT COMMIT THAT WAS SCANNED
      # ----------------------------------------------------------

      - name: Checkout scanned commit
        uses: actions/checkout@v4

        with:
          ref: ${{ github.sha }}


      # ----------------------------------------------------------
      # 16. CONFIGURE AWS OIDC
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ env.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}

          role-session-name: GitHubActionsSecurityPOC

          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}


      # ----------------------------------------------------------
      # 17. VERIFY AWS IDENTITY
      # ----------------------------------------------------------

      - name: Verify AWS identity
        run: |

          aws sts get-caller-identity


      # ----------------------------------------------------------
      # 18. LOGIN TO ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # 19. CREATE IMAGE TAG
      # ----------------------------------------------------------

      - name: Generate Docker image information
        id: image
        run: |

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"

          SHORT_SHA="${GITHUB_SHA::12}"

          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')

          IMAGE_TAG="${SAFE_BRANCH}-${SHORT_SHA}"

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Image:"
          echo "${IMAGE_URI}:${IMAGE_TAG}"


      # ----------------------------------------------------------
      # 20. BUILD DOCKER IMAGE
      #
      # Dockerfile is inside:
      #
      # app/Dockerfile
      #
      # Application context:
      #
      # app/
      # ----------------------------------------------------------

      - name: Build Docker image
        run: |

          docker build \
            -f app/Dockerfile \
            -t "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}" \
            ./app


      # ----------------------------------------------------------
      # 21. PUSH IMAGE TO ECR
      # ----------------------------------------------------------

      - name: Push Docker image to ECR
        run: |

          docker push \
            "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}"


      # ----------------------------------------------------------
      # 22. INSTALL COSIGN
      # ----------------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3


      # ----------------------------------------------------------
      # 23. SIGN ECR IMAGE
      #
      # Keyless signing uses GitHub's OIDC identity.
      # No Cosign private key is stored in GitHub.
      # ----------------------------------------------------------

      - name: Sign Docker image with Cosign
        env:

          COSIGN_YES: "true"

        run: |

          cosign sign \
            "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}"


      # ----------------------------------------------------------
      # 24. GET IMAGE DIGEST
      # ----------------------------------------------------------

      - name: Get ECR image digest
        id: digest
        run: |

          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${{ steps.image.outputs.image_tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "FINAL IMAGE"
          echo "=========================================="

          echo "Repository:"
          echo "${{ steps.image.outputs.image_uri }}"

          echo ""

          echo "Tag:"
          echo "${{ steps.image.outputs.image_tag }}"

          echo ""

          echo "Digest:"
          echo "${DIGEST}"

          echo ""

          echo "Cosign:"
          echo "SIGNED"

          echo "=========================================="


      # ----------------------------------------------------------
      # 25. FINAL GITHUB SUMMARY
      # ----------------------------------------------------------

      - name: Final deployment summary
        run: |

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          # 🚀 Secure Image Published

          | Item | Value |
          |---|---|
          | Repository | \`${{ steps.image.outputs.image_uri }}\` |
          | Tag | \`${{ steps.image.outputs.image_tag }}\` |
          | Digest | \`${{ steps.digest.outputs.digest }}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | Security Approval | ✅ APPROVED |
          | Docker Build | ✅ SUCCESS |
          | ECR Push | ✅ SUCCESS |
          | Cosign | ✅ SIGNED |

          EOF
