
name: Snyk Python Alpine Image Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Authenticate with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Pull Python Alpine image
        run: docker pull python:3.12-alpine

      - name: Scan image and generate JSON report
        id: scan
        continue-on-error: true
        run: |
          snyk container test python:3.12-alpine \
            --file=Dockerfile \
            --json-file-output=snyk-container-results.json \
            || true

          snyk container test python:3.12-alpine \
            --file=Dockerfile \
            || true

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-report
          path: snyk-container-results.json
          if-no-files-found: warn
          retention-days: 30
